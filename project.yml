name: Icarus
options:
  bundleIdPrefix: com.theicarusedge
  deploymentTarget:
    iOS: "17.0"
targets:
  Icarus:
    type: application
    platform: iOS
    sources:
      - path: Icarus
    info:
      path: Icarus/Info.plist
      properties:
        CFBundleDisplayName: Icarus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIAppFonts: [SchibstedGrotesk.ttf, Archivo.ttf]
        NSFaceIDUsageDescription: Unlock Icarus with Face ID.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theicarusedge.icarus
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
